name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Prettier
        run: make install-prettier

      - name: Run lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install XSpec
        run: make install-xspec

      - name: Install Saxon-HE
        run: make install-saxon

      - name: Run XSpec
        run: make test

      - name: Upload XSpec reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xspec-reports
          path: test/xspec/
          if-no-files-found: ignore

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch the XSD for XSDs
        run: make install-sample-schemas

      - name: Render W3C XMLSchema.xsd
        uses: ./
        with:
          xsd-file: .tools/schemas/XMLSchema.xsd
          output-dir: out

      - name: Upload generated sites
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          if-no-files-found: error

  html5:
    name: HTML5 validation
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download rendered site
        uses: actions/download-artifact@v7
        with:
          name: site
          path: out

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download vnu.jar
        run: make install-vnu

      - name: Validate HTML5
        run: |
          java -jar .tools/vnu.jar --also-check-css \
            out/index.html out/assets/xsdstyle.css

  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download rendered site
        uses: actions/download-artifact@v7
        with:
          name: site
          path: out

      - name: Install axe CLI
        run: make install-axe

      - name: Run WCAG 2.2 AA audit
        run: make lint-a11y
