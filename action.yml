name: xsdstyle
description: Render an XSD schema to interactive HTML documentation.
author: Bardi Harborow
branding:
  icon: file-text
  color: blue

inputs:
  xsd-file:
    description: Path to the input .xsd file, relative to the workspace.
    required: true
  output-dir:
    description: Directory to write the generated site into.
    required: false
    default: out
  output-html:
    description: Filename for the generated HTML page (placed inside output-dir).
    required: false
    default: index.html
  title:
    description: Page title. Defaults to the schema @id, then targetNamespace, then "XSD Documentation".
    required: false
    default: ""
  base-href:
    description: URL prefix for the bundled xsdstyle.css and xsdstyle.js.
    required: false
    default: "./assets/"
  include-source:
    description: Embed the raw XSD source per component (true|false).
    required: false
    default: "true"
  doc-html:
    description: How to render embedded HTML inside xs:documentation (safe|permissive).
    required: false
    default: "safe"
  ui-lang:
    description: BCP 47 language tag for the UI chrome (<html lang="…"> and message catalog).
    required: false
    default: "en"
  xml-lang:
    description: BCP 47 language tag for XSD-sourced prose. Used as the lang="…" fallback on documentation wrappers when no per-block xml:lang.
    required: false
    default: "en"
  dir:
    description: Writing direction for <html dir="…"> (auto|ltr|rtl). auto infers rtl from ui-lang.
    required: false
    default: "auto"
  noindex:
    description: Emit <meta name="robots" content="noindex"> in the generated page (true|false).
    required: false
    default: "false"

outputs:
  output-dir:
    description: Directory containing the generated index.html and assets/.

runs:
  using: docker
  image: Dockerfile
  env:
    INPUT_XSD_FILE: ${{ inputs.xsd-file }}
    INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
    INPUT_OUTPUT_HTML: ${{ inputs.output-html }}
    INPUT_TITLE: ${{ inputs.title }}
    INPUT_BASE_HREF: ${{ inputs.base-href }}
    INPUT_INCLUDE_SOURCE: ${{ inputs.include-source }}
    INPUT_DOC_HTML: ${{ inputs.doc-html }}
    INPUT_UI_LANG: ${{ inputs.ui-lang }}
    INPUT_XML_LANG: ${{ inputs.xml-lang }}
    INPUT_DIR: ${{ inputs.dir }}
    INPUT_NOINDEX: ${{ inputs.noindex }}
